# Result: src-tauri/gen/android/app/build/outputs/apk/*/release/
services:
  build:
    platform: linux/amd64
    build:
      context: .
    image: regrind-build
    init: true
    working_dir: /work
    volumes:
      - .:/work
      - regrind-nix:/nix
      - regrind-cargo-target:/work/src-tauri/target # Rust build artifacts
      - regrind-node-modules:/work/node_modules # bun dependencies
      - regrind-cargo-home:/root/.cargo # crate registry, git deps
      - regrind-gradle:/root/.gradle-opengrind # Gradle dist, caches (build-android's GRADLE_USER_HOME)
      - regrind-bun:/root/.bun # bun download cache
    command: ["nix", "run", ".#build-android"]

volumes:
  regrind-nix:
  regrind-cargo-target:
  regrind-node-modules:
  regrind-cargo-home:
  regrind-gradle:
  regrind-bun:
